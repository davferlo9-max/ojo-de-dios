<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OJO DE DIOS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gl"></div>
<canvas id="overlay"></canvas>
<div id="hud">
  <header>
    <div class="brand"><i class="eye"></i>OJO DE DIOS <small>v9.0 · OBSERVACIÓN GLOBAL EN TIEMPO REAL</small></div>
    <form id="search"><input id="q" placeholder="BUSCAR CUALQUIER LUGAR DEL MUNDO, vuelo, matrícula, ISS, MIL" autocomplete="off"><button>RASTREAR</button></form>
    <div id="clock"></div>
  </header>
  <aside id="left">
    <h3>ESTADO DE FUENTES</h3>
    <pre id="sources"></pre>
    <h3>FEEDS (DEMO)</h3>
    <canvas class="feed" width="220" height="110"></canvas>
    <canvas class="feed" width="220" height="110"></canvas>
    <canvas class="feed" width="220" height="110"></canvas>
  </aside>
  <aside id="right">
    <h3>OBJETIVO</h3>
    <pre id="target">[SIN OBJETIVO]
Clic en un punto o use el buscador.</pre>
    <h3>REGISTRO</h3>
    <div id="log"></div>
  </aside>
  <footer>
    <span id="coords">LAT --- LON ---</span>
    <span id="stats"></span>
    <span><button id="layer">CAPA: SATÉLITE</button> <button id="mil">SOLO MILITARES</button> <button id="release">LIBERAR</button></span>
  </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
<script src="app.js"></script>
</body>
</html>
